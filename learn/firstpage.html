<!DOCTYPE html>
<html>
<head>
    <title>My Page with Current Date & Time</title>
    <style>
        body {
            background-color: #f0f8ff; /* Light blue background */
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #2e8b57; /* Sea green title */
        }
        p {
            color: #8b0000; /* Dark red text */
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Page</h1>
    <p id="datetime"></p>

    <script>
        function updateDateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            document.getElementById("datetime").textContent = 
                "Current Date & Time: " + now.toLocaleString(undefined, options);
        }

        // Update immediately
        updateDateTime();
        // Refresh every second
        //setInterval(updateDateTime, 1000);
    </script>
</body>
</html>
